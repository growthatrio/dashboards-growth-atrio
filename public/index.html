<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Dashboards Atrio · Entrar</title>
<link rel="stylesheet" href="/assets/theme.css">
<style>
  .box { max-width: 380px; margin: 14vh auto 0; background: var(--color-panel); border: 1px solid var(--color-border-line); border-radius: 12px; padding: 28px; border-top: 4px solid #DB9B0E; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { color: var(--color-fg-muted); margin: 0 0 20px; }
  label { display: block; font-size: 12px; color: var(--color-fg-muted); margin: 12px 0 4px; }
  input { width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--color-border-line); background: var(--color-bg); color: var(--color-fg); font-size: 14px; }
  input:focus-visible, button:focus-visible { outline: 2px solid #DB9B0E; outline-offset: 1px; }
  button { margin-top: 20px; width: 100%; padding: 11px; border: 0; border-radius: 8px; background: #DB9B0E; color: #000; font-weight: 600; font-size: 14px; cursor: pointer; }
  button[disabled] { opacity: .6; cursor: wait; }
  #msg { color: var(--color-bad); font-size: 13px; margin-top: 12px; min-height: 18px; }
</style>
</head>
<body>
<main class="box">
  <h1>Dashboards Atrio</h1>
  <p>Acesso restrito. Entre com seu e-mail e senha.</p>
  <form id="f">
    <label for="email">E-mail</label>
    <input id="email" type="email" autocomplete="username" required autofocus>
    <label for="pw">Senha</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <button id="b" type="submit">Entrar</button>
    <div id="msg" role="alert"></div>
  </form>
</main>
<script>
  document.getElementById('f').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var b = document.getElementById('b'), m = document.getElementById('msg');
    b.disabled = true; m.textContent = '';
    fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin',
      body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('pw').value }) })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (x) { if (x.ok) { location.href = '/menu'; } else { m.textContent = x.j.error || 'Não foi possível entrar.'; b.disabled = false; } })
      .catch(function () { m.textContent = 'Sem conexão. Tente de novo.'; b.disabled = false; });
  });
</script>
</body>
</html>
